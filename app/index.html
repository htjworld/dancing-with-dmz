<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dancing with DMZ</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200..500&display=swap">
<!-- Pretendard(SIL OFL 1.1): 본문 고딕. 화면에 쓰는 글자만 나눠 받는다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="DMZ 지도"></div>

<header id="top">
  <h1>Dancing with DMZ</h1>
  <p id="lead"></p>
</header>

<button id="lang" type="button"></button>
<button id="to-night" type="button"></button>
<button id="sound" type="button" aria-pressed="true" aria-label="소리 켜짐"><img class="on" src="media/icons/sound-on.svg" alt=""><img class="off" src="media/icons/sound-off.svg" alt=""></button>
<section id="night" aria-live="polite"></section>
<section id="film"></section>
<aside id="proof" aria-live="polite" hidden></aside>
<div id="land-read" hidden></div>
<section id="opening"></section>
<aside id="panel" aria-live="polite"></aside>
<div id="stage" hidden>
  <figure id="ending-cloud" hidden><img alt=""></figure>
  <p id="ending-line" aria-live="polite"></p>
  <p id="ticker" hidden></p>
  <p id="stage-note">박자에 맞춘 작은 출렁임은 연출입니다. 선의 높이, 함께 뛰는 순간, 멈춤은 NISAR가 본 레이더 신호의 변화입니다. 땅이 실제로 움직인 것이 아닙니다.</p>
</div>

<section id="intro" hidden aria-live="polite"></section>
<section id="ending-card" hidden aria-live="polite"></section>
<div id="piece-toast" hidden role="status"></div>

<footer id="bottom">
  <div id="date-slider"></div>
  <p id="credit">NISAR (NASA/ISRO) · ASF DAAC · NASA POWER · © OpenStreetMap contributors · OpenFreeMap</p>
</footer>

<div id="notice" hidden></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
